version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: options_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: options_trading
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: options_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: options_rabbitmq
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: options_api
    restart: always
    ports:
      - "8000:8000"
    env_file: backend/.env  # SECRET_KEY, ENCRYPTION_KEY, CORS_ORIGINS, ...
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/options_trading
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - rabbitmq

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: options_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: always
    env_file: backend/.env  # SECRET_KEY, ENCRYPTION_KEY, CORS_ORIGINS, ...
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/options_trading
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - rabbitmq

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: options_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: always
    env_file: backend/.env  # SECRET_KEY, ENCRYPTION_KEY, CORS_ORIGINS, ...
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/options_trading
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - rabbitmq

volumes:
  postgres_data:
